<div class="container-fluid fixed-search-bar">
  <form class="d-flex" role="search" [formGroup]="searchFormGroup" (ngSubmit)="applySearchFilter()">
    <input formControlName="searchInput" class="form-control me-2" type="search" placeholder="Search" aria-label="Search"/>
    <div class="dropdown">
      <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
        Sort by
      </button>
      <ul class="dropdown-menu">
        @for (opt of sortByOptions() | keyvalue: originalOrder; track opt.key) {
          <li>
            <a class="dropdown-item" (click)="setSortType(`${opt.key}`)">{{ opt.value }}</a>
          </li>
        }
      </ul>
    </div>
    <button class="btn btn-outline-success" type="submit">Search</button>
  </form>
</div>
